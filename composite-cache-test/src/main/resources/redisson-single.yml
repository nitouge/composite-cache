# ========================================
# 单机模式
# ========================================
singleServerConfig:
  # Redis服务器地址
  address: "redis://localhost:6379"
  # 密码（如果没有密码，注释掉这行或设置为null）
  password: admin@123456
  # 数据库编号
  database: 2
  # 连接池大小
  connectionPoolSize: 64
  # 最小空闲连接数
  connectionMinimumIdleSize: 10
  # 空闲连接超时时间（毫秒）
  idleConnectionTimeout: 10000
  # 连接超时时间（毫秒）
  connectTimeout: 10000
  # 命令等待超时时间（毫秒）
  timeout: 3000
  # 命令失败重试次数
  retryAttempts: 3
  # 命令重试间隔时间（毫秒）
  retryInterval: 1500
  # 订阅连接池大小
  subscriptionConnectionPoolSize: 50
  # 客户端名称
  clientName: composite-cache

# 线程池配置
threads: 16
nettyThreads: 32

# 编解码器（使用 Kryo 或 FST，支持 Java 8 时间类型）
codec: !<org.redisson.codec.JsonJacksonCodec> {}
