<title>Composite Cache 测试台</title>
<!-- 说明：故意不引入 jQuery/外部 CDN，纯原生 fetch，保证本地离线也能直接打开测试 -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f6f9; color: #222; }
  header { background: linear-gradient(90deg,#111827,#1f2937); color: #fff; padding: 14px 22px; display: flex; align-items: baseline; gap: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }

  .tabs { display: flex; gap: 4px; background: #111827; padding: 0 12px; flex-wrap: wrap; }

  .layout { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }

  .tbtn { background: #1e2746; color: #cbd5e1; border: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .tbtn:hover { background: #2a355f; color: #fff; }
  #resultBody { padding: 12px 14px; overflow: auto; flex: 1; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .desc { color: #6b7280; font-size: 12px; margin-bottom: 10px; line-height: 1.5; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { font-size: 12px; color: #374151; }
  input, textarea { border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 9px; font-size: 13px; font-family: inherit; }

  button.go:hover { background: #2563eb; }
  button.go:active { transform: translateY(1px); }
  button.go.safe { background: #10b981; } button.go.safe:hover { background: #059669; }
  button.danger { background: #ef4444; } button.danger:hover { background: #dc2626; }
  .meth { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-right: 6px; color: #fff; }
  .GET { background: #16a34a; } .POST { background: #2563eb; } .PUT { background: #d97706; } .DELETE { background: #dc2626; }
  .result .line { color: #9bb4ff; font-size: 12px; word-break: break-all; margin-bottom: 4px; }
  .result .status { font-weight: 700; }
  .result pre { white-space: pre-wrap; word-break: break-all; font-size: 12.5px; line-height: 1.5; margin: 8px 0 0; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  .lat { color: #fbbf24; } .cmp-faster { color: #4ade80; } .cmp-slower { color: #f59e0b; }
  .loading { color: #93c5fd; } .loading::after { content: ""; animation: dots 1s steps(4,end) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} 100%{content:""} }
  .hint { font-size: 12px; color: #6b7280; margin: 4px 0 12px; line-height: 1.6; }
  .hist-title { padding: 8px 14px 4px; color: #6b7a9c; font-size: 11px; border-top: 1px solid #1e2746; }

  .hist-item .hmeta { color: #6b7a9c; }
  .tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:10px; background:#ecfdf5; color:#059669; border:1px solid #a7f3d0; margin-left:6px;}
  /* 缓存监控面板 */
  .dash-controls { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .dash-controls select { border:1px solid #d1d5db; border-radius:6px; padding:5px 7px; font-size:12px; }
  .dash-status { font-size:12px; color:#6b7280; margin-left:auto; }

  table.dash th { background:#f3f4f6; color:#374151; font-weight:700; font-size:11.5px; }
  table.dash th:first-child, table.dash td:first-child { text-align:left; }
  table.dash td.name { font-weight:600; color:#111827; text-align:left; }
  table.dash td.type { color:#6b7280; font-size:11px; text-align:left; }
  table.dash tr:hover td { background:#f9fafb; }
  .bar { position:relative; height:16px; width:118px; background:#eef0f4; border-radius:8px; overflow:hidden; display:inline-block; vertical-align:middle; }
  .bar > i { position:absolute; left:0; top:0; bottom:0; border-radius:8px; }
  .bar > span { position:relative; z-index:1; font-size:10.5px; color:#111827; padding-left:6px; line-height:16px; }
  .hr-high > i { background:#86efac; } .hr-mid > i { background:#fde68a; } .hr-low > i { background:#fca5a5; }
  .dash-empty { color:#6b7280; font-size:13px; padding:14px; background:#fff; border:1px dashed #d1d5db; border-radius:10px; }
  .dash-err { color:#b91c1c; font-size:13px; padding:14px; background:#fef2f2; border:1px solid #fecaca; border-radius:10px; line-height:1.6; }
  .act-cell { text-align:center; } .act-cell button { font-size:11px; padding:4px 8px; }
</style>
</head>
<body>
<header>
  <h1>⚡ Composite Cache 测试台</h1>
  <span class="sub">多级缓存（L1 Caffeine + L2 Redis）· 注解 / 编程式 / 批量级联 / 一致性 / 难题演示 / 监控</span>
</header>
<div class="tabs" id="tabs"></div>
<div class="layout">
  <div class="panel" id="panel"></div>
  <div class="result">
    <div class="rhead">
      <span>📤 结果</span>
      <span class="tools">
        <button class="tbtn" id="copyBtn" title="复制返回 JSON">复制</button>
        <button class="tbtn" id="clearHistBtn" title="清空历史">清空历史</button>
      </span>
    </div>
    <div id="resultBody">
      <div class="line">点击左侧按钮发起请求，结果显示在这里。</div>
      <div class="hint" style="color:#7c89b8">提示：对同一个 GET 连续点两次，观察 <span class="lat">latency</span> 与返回里的 queryTime —— 第一次回源较慢，第二次走缓存极快（会自动与上次同请求对比）。</div>
    </div>
    <div class="hist-title">🕘 请求历史（点击可一键重发）</div>
    <div id="history" class="history"></div>
  </div>
</div>

<script>
const resultBody = document.getElementById('resultBody');
const historyEl = document.getElementById('history');
let lastResponseText = '';
const lastLatency = {};   // "METHOD URL" -> ms（用于本次/上次耗时对比）
const history = [];        // {method,url,body,status,ms}

function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function renderLoading(method, url) {
  resultBody.innerHTML =
    '<div class="line"><span class="meth ' + method + '">' + method + '</span>' + escapeHtml(url) + '</div>' +
    '<div class="line loading">请求中</div>';
}

function show(method, url, status, ms, body, isErr) {
  const statusClass = isErr || status >= 400 ? 'err' : 'ok';
  let pretty;
  try { pretty = JSON.stringify(typeof body === 'string' ? JSON.parse(body) : body, null, 2); }
  catch (e) { pretty = String(body); }
  lastResponseText = pretty;

  // 与上次同请求的耗时对比
  const key = method + ' ' + url;
  const prev = lastLatency[key];
  let cmp = '';
  if (prev !== undefined && !isErr) {
    const faster = Number(ms) < Number(prev);
    cmp = ' · <span class="' + (faster ? 'cmp-faster' : 'cmp-slower') + '">上次 ' + prev + ' ms（' +
          (faster ? '↓ 快了 ' + (prev - ms).toFixed(1) + ' ms，命中缓存' : '↑ 慢了 ' + (ms - prev).toFixed(1) + ' ms') + '）</span>';
  }
  if (!isErr) lastLatency[key] = Number(ms);

  resultBody.innerHTML =
    '<div class="line"><span class="meth ' + method + '">' + method + '</span>' + escapeHtml(url) + '</div>' +
    '<div class="line">状态：<span class="status ' + statusClass + '">' + status + '</span> · ' +
    '耗时：<span class="lat">' + ms + ' ms</span>' + cmp + '</div>' +
    '<pre>' + escapeHtml(pretty) + '</pre>';

  pushHistory({ method, url, body, status, ms });
}

function pushHistory(item) {
  history.unshift(item);
  if (history.length > 15) history.pop();
  renderHistory();
}
function renderHistory() {
  historyEl.innerHTML = '';
  history.forEach(h => {
    const div = document.createElement('div');
    div.className = 'hist-item';
    const sc = h.status >= 400 || h.status === 'ERROR' ? 'err' : 'ok';
    div.innerHTML = '<span class="meth ' + h.method + '">' + h.method + '</span>' +
                    '<span class="hurl">' + escapeHtml(h.url) + '</span>' +
                    '<span class="hmeta"><span class="' + sc + '">' + h.status + '</span> · ' + h.ms + 'ms</span>';
    div.title = '点击重发';
    div.onclick = () => send(h.method, h.url, h.body);
    historyEl.appendChild(div);
  });
}

async function send(method, url, body) {
  renderLoading(method, url);
  const t0 = performance.now();
  try {
    const opts = { method, headers: {} };
    if (body !== undefined && body !== null && body !== '') {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = typeof body === 'string' ? body : JSON.stringify(body);
    }
    const res = await fetch(url, opts);
    const text = await res.text();
    const ms = (performance.now() - t0).toFixed(1);
    show(method, url, res.status, ms, text, !res.ok);
  } catch (e) {
    const ms = (performance.now() - t0).toFixed(1);
    show(method, url, 'ERROR', ms, String(e), true);
  }
}
const val = id => document.getElementById(id).value.trim();

document.getElementById('copyBtn').onclick = () => {
  if (!lastResponseText) return;
  navigator.clipboard && navigator.clipboard.writeText(lastResponseText);
  const b = document.getElementById('copyBtn'); const old = b.textContent;
  b.textContent = '已复制'; setTimeout(() => b.textContent = old, 1000);
};
document.getElementById('clearHistBtn').onclick = () => { history.length = 0; renderHistory(); };

// ---- Tab definitions ----
const tabs = [
  { id: 'user', name: '用户（注解缓存）' },
  { id: 'batch', name: '批量 / 级联（编程式）' },
  { id: 'product', name: '商品' },
  { id: 'consistency', name: '一致性' },
  { id: 'demo', name: '缓存难题（演示）' },
  { id: 'monitor', name: '监控' },
];

const panes = {

      <div class="row"><label>id</label><input id="u_id" value="1"/>
      <button class="go" onclick="send('GET','/api/users/'+val('u_id'))">默认策略查询</button></div>
      <div class="desc" style="margin-top:10px"><b>策略对比测试</b>：三种不同的回源策略，可对比性能与行为差异。</div>
      <div class="row" style="margin-top:8px">
      <button class="go" onclick="send('GET','/api/users/hot/'+val('u_id'))" style="background:#10b981" onmouseover="this.style.background='#059669'" onmouseout="this.style.background='#10b981'">热点数据(逻辑过期+无物理TTL)</button>
      <button class="go" onclick="send('GET','/api/users/warm/'+val('u_id'))" style="background:#f59e0b" onmouseover="this.style.background='#d97706'" onmouseout="this.style.background='#f59e0b'">普通热点(逻辑过期+TTL兜底)</button>
      <button class="go" onclick="send('GET','/api/users/normal/'+val('u_id'))">普通数据(分布式锁)</button></div>
      <div class="hint" style="margin-top:6px; font-size:11px">
        🔥 <b>热点数据</b>: LOGICAL_EXPIRE策略，Redis key永不过期，适合核心高并发场景<br/>
        ⚡ <b>普通热点</b>: LOGICAL_EXPIRE + 物理TTL兜底(3倍)，防止异步刷新失败<br/>
        🔒 <b>普通数据</b>: LOCK策略，分布式锁防击穿，适合非热点场景
      </div></div>
    <div class="card"><h3><span class="meth GET">GET</span>查询全部 / 按用户名</h3>

    <div class="card"><h3><span class="meth POST">POST</span>创建用户（写缓存）</h3>
      <div class="desc">/api/users</div>
      <textarea id="u_create">{"username":"Frank","email":"frank@example.com","age":27,"address":"Nanjing"}</textarea>
      <div class="row" style="margin-top:8px"><button class="go" onclick="send('POST','/api/users', val('u_create'))">创建</button></div></div>

      <div class="row"><label>id</label><input id="u_uid" value="1"/></div>
      <textarea id="u_update" style="margin-top:8px">{"username":"Alice Updated","email":"alice@example.com","age":26,"address":"Beijing"}</textarea>

      <div class="row"><label>id</label><input id="u_did" value="1"/>
      <button class="go danger" onclick="send('DELETE','/api/users/'+val('u_did'))">删除用户</button>
      <button class="go danger" onclick="send('DELETE','/api/users/cache/clear')">清空 user 缓存</button></div></div>

      <div class="row"><label>ids(JSON)</label><input id="u_ids" value="[1,2,3]" style="width:160px"/>
      <button class="go" onclick="send('POST','/api/users/batch', val('u_ids'))">批量查询</button>
      <button class="go" onclick="send('POST','/api/users/cache/batch-test', val('u_ids'))">batchGet 测试</button></div>

      <button class="go" onclick="send('GET','/api/users/cache/stats')">缓存统计</button></div></div>
  `,
  batch: `
    <div class="hint">编程式 CacheTemplate 批量操作：一次查 L1→L2→仅对未命中回源→回填→空值防穿透，按顺序返回。</div>

// ---- 缓存监控面板 ----
let dashTimer = null;

async function loadCacheDash() {
  const box = document.getElementById('cacheDash');
  const statusEl = document.getElementById('dashStatus');
  if (!box) return;
  if (statusEl) statusEl.textContent = '加载中…';
  try {
    const res = await fetch('/actuator/compositecache');
    if (res.status === 404) {
      box.innerHTML = '<div class="dash-err">404：未找到 compositecache 端点。请确认已<b>重启 test 应用</b>，且 application.yml 的 <code>management.endpoints.web.exposure.include</code> 含 <code>compositecache</code>。</div>';
      if (statusEl) statusEl.textContent = '';
      return;
    }
    if (!res.ok) {
      box.innerHTML = '<div class="dash-err">HTTP ' + res.status + '</div>';
      if (statusEl) statusEl.textContent = '';
      return;
    }
    renderCacheDash(await res.json());
    if (statusEl) statusEl.textContent = '更新于 ' + new Date().toLocaleTimeString();
  } catch (e) {
    box.innerHTML = '<div class="dash-err">请求失败：' + escapeHtml(String(e)) + '</div>';
    if (statusEl) statusEl.textContent = '';
  }
}

function hrClass(r) { return r >= 0.8 ? 'hr-high' : (r >= 0.5 ? 'hr-mid' : 'hr-low'); }
function pct(r) { return (r * 100).toFixed(1) + '%'; }
function bar(r) { return '<span class="bar ' + hrClass(r) + '"><i style="width:' + Math.round(r * 100) + '%"></i><span>' + pct(r) + '</span></span>'; }
const numOr = (v) => (v != null ? v : '-');

function renderCacheDash(data) {
  const box = document.getElementById('cacheDash');
  const caches = data.caches || {};
  const names = Object.keys(caches);
  let html = '';
  const g = data.global;
  if (g) {
    html += '<div class="metrics-grid">' +
      '<div class="metric"><div class="k">全局命中率</div><div class="v">' + pct(g.hitRate || 0) + '</div></div>' +
      '<div class="metric"><div class="k">命中 / 未命中</div><div class="v">' + (g.totalHits || 0) + ' <small>/ ' + (g.totalMisses || 0) + '</small></div></div>' +
      '<div class="metric"><div class="k">总请求</div><div class="v">' + (g.totalRequests || 0) + '</div></div>' +
      '<div class="metric"><div class="k">缓存数</div><div class="v">' + (data.cacheCount != null ? data.cacheCount : names.length) + '</div></div>' +
      '</div>';
  }
  if (names.length === 0) {
    html += '<div class="dash-empty">暂无缓存（先到其它标签页调用接口产生缓存，再回来刷新）。' + (g ? '' : '未启用 metrics 或无 MeterRegistry，故无命中统计。') + '</div>';
    box.innerHTML = html;
    return;
  }
  html += '<table class="dash"><thead><tr>' +
    '<th>缓存</th><th>类型</th><th>L1条目</th><th>命中</th><th>未命中</th><th>L1命中</th><th>L2命中</th><th>驱逐</th><th>命中率</th><th>操作</th>' +
    '</tr></thead><tbody>';
  names.sort().forEach(name => {
    const c = caches[name] || {};
    const s = c.stats || {};
    const r = s.hitRate != null ? s.hitRate : 0;
    html += '<tr>' +
      '<td class="name">' + escapeHtml(name) + '</td>' +
      '<td class="type">' + escapeHtml(c.type || '-') + '</td>' +
      '<td>' + numOr(c.l1Size) + '</td>' +
      '<td>' + numOr(s.hitCount) + '</td>' +
      '<td>' + numOr(s.missCount) + '</td>' +
      '<td>' + numOr(s.l1HitCount) + '</td>' +
      '<td>' + numOr(s.l2HitCount) + '</td>' +
      '<td>' + numOr(s.evictionCount) + '</td>' +
      '<td>' + (s.hitCount != null ? bar(r) : '-') + '</td>' +
      '<td class="act-cell"><button class="go danger" onclick="dashClear(\'' + encodeURIComponent(name) + '\')">清空</button></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  box.innerHTML = html;
}

function toggleDashAuto() {
  stopDashAuto();
  const auto = document.getElementById('dashAuto');
  if (auto && auto.checked) {
    const sel = document.getElementById('dashInterval');
    const iv = parseInt((sel && sel.value) || '3000', 10);
    dashTimer = setInterval(loadCacheDash, iv);
    loadCacheDash();
  }
}
function stopDashAuto() { if (dashTimer) { clearInterval(dashTimer); dashTimer = null; } }

async function dashClear(nameEnc) {
  await send('DELETE', '/actuator/compositecache/' + nameEnc);
  loadCacheDash();
}
async function dashClearAll() {
  await send('DELETE', '/actuator/compositecache');
  loadCacheDash();
}
async function dashEvict() {
  const cache = ((document.getElementById('dashEvCache') || {}).value || '').trim();
  const key = ((document.getElementById('dashEvKey') || {}).value || '').trim();
  if (!cache || !key) { alert('请填写 cacheName 和 key'); return; }
  await send('POST', '/actuator/compositecache/' + encodeURIComponent(cache), { key: key });
  loadCacheDash();
}

// build tabs
const tabBar = document.getElementById('tabs');
const panel = document.getElementById('panel');
tabs.forEach((t, i) => {
  const b = document.createElement('button');
  b.textContent = t.name; b.dataset.id = t.id;
  if (i === 0) b.classList.add('active');
  b.onclick = () => activate(t.id);
  tabBar.appendChild(b);
});
function activate(id) {
  stopDashAuto();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  panel.innerHTML = panes[id];
  if (id === 'monitor') loadCacheDash();   // 进入监控页自动拉一次
}
activate('user');
</script>
